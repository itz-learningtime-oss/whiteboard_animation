name: Verify Scribble Studio
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type-check the studio
        run: npx tsc --noEmit
      - name: Build the studio
        run: npm run build
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whiteboard-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: whiteboard-engine/requirements.txt
      - name: Install system graphics and speech dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng libespeak1 libcairo2 libraqm0 fonts-dejavu-core
      - name: Set up the local rendering engine
        run: python setup_engine.py --skip-fonts
      - name: Execute unit and real MP4 integration tests
        run: python -m unittest discover -s tests -v