name: Verify Image Whiteboard Builder
on: [push, pull_request]
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install FFmpeg and FFprobe
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
      - name: Install dependencies and execute real render tests
        run: python setup_builder.py --test